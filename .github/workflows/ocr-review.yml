name: OpenCodeReview

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]

jobs:
  review:
    if: |
      github.event_name == 'pull_request' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       (startsWith(github.event.comment.body, '/open-code-review') ||
        startsWith(github.event.comment.body, '@open-code-review')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install OpenCodeReview
        run: npm install -g @alibaba-group/open-code-review

      - name: Configure LLM provider (Volcano Engine Ark)
        env:
          ARK_API_KEY: ${{ secrets.OCR_LLM_AUTH_TOKEN }}
        run: |
          if [ -z "$ARK_API_KEY" ]; then
            echo "::warning::OCR_LLM_AUTH_TOKEN secret is not configured."
            exit 0
          fi
          # volcengine is a built-in provider with protocol=openai
          # base URL is preset to https://ark.cn-beijing.volces.com/api/v3
          ocr config set provider volcengine
          ocr config set model "${{ vars.OCR_LLM_MODEL }}"
          ocr config set providers.volcengine.api_key "$ARK_API_KEY"
          # verify config
          ocr llm test

      - name: Run OCR review
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ocr review \
            --provider volcengine \
            --model "${{ vars.OCR_LLM_MODEL }}" \
            --from origin/${{ github.base_ref }} \
            --to origin/${{ github.head_ref }} \
            --format json \
            --background "${{ github.event.pull_request.title }}" \
            --concurrency 5
# OCR Volcano Engine Integration
