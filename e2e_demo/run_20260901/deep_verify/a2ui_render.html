<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>A2UI Render</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Segoe UI',Roboto,sans-serif; }
input[type="range"] { height:4px; -webkit-appearance:none; background:#e0e0e0; border-radius:2px; }
input[type="range"]::-webkit-slider-thumb { -webkit-appearance:none; width:18px; height:18px; border-radius:50%; background:#1677ff; }
button { font-family:inherit; }
</style>
</head>
<body>
<div style="display:flex;flex-direction:column;width:100%;height:100vh;background:#f5f5f5;color:#212121;"><div style="display:flex;flex-direction:row;background:#ffffff;padding:12px 20px;justify-content:space-between;align-items:center;border-bottom:1px solid #e8e8e8;"><span style="font-size:18px;font-weight:600;">声音与显示</span><button style="width:32px;height:32px;background:transparent;font-size:20px;border:none;border-radius:4px;cursor:pointer;">×</button></div><div style="display:flex;flex-direction:row;flex:1;overflow:hidden;"><div style="display:flex;flex-direction:column;width:240px;background:#ffffff;padding:16px;gap:16px;border-right:1px solid #e8e8e8;"><span style="font-size:20px;font-weight:700;">设置</span><input type="text" placeholder="搜索设置项" style="width:100%;padding:8px 12px;border:1px solid #d9d9d9;border-radius:6px;box-sizing:border-box;"/><div style="display:flex;flex-direction:column;gap:4px;gap:4px;"><div style="padding:10px 12px;border-radius:6px;background:transparent;display:flex;justify-content:space-between;align-items:center;"><span style="color:#212121;font-weight:400;font-size:14px;">企业服务配置</span><span style="color:#999;font-size:12px;">已配置</span></div><div style="padding:10px 12px;border-radius:6px;background:#e6f4ff;display:flex;justify-content:space-between;align-items:center;"><span style="color:#1677ff;font-weight:600;font-size:14px;">声音与显示</span></div><div style="padding:10px 12px;border-radius:6px;background:transparent;display:flex;justify-content:space-between;align-items:center;"><span style="color:#212121;font-weight:400;font-size:14px;">摄像机</span></div><div style="padding:10px 12px;border-radius:6px;background:transparent;display:flex;justify-content:space-between;align-items:center;"><span style="color:#212121;font-weight:400;font-size:14px;">壁纸</span></div><div style="padding:10px 12px;border-radius:6px;background:transparent;display:flex;justify-content:space-between;align-items:center;"><span style="color:#212121;font-weight:400;font-size:14px;">Wi-Fi</span><span style="color:#999;font-size:12px;">已连接</span></div><div style="padding:10px 12px;border-radius:6px;background:transparent;display:flex;justify-content:space-between;align-items:center;"><span style="color:#212121;font-weight:400;font-size:14px;">智慧功能</span></div><div style="padding:10px 12px;border-radius:6px;background:transparent;display:flex;justify-content:space-between;align-items:center;"><span style="color:#212121;font-weight:400;font-size:14px;">高级设置</span></div></div></div><div style="display:flex;flex-direction:column;padding:24px 32px;gap:16px;flex:1;overflow-y:auto;"><div style="background:#ffffff;padding:8px 0;border-radius:12px;box-shadow:0 1px 2px rgba(0,0,0,0.05);"><div style="display:flex;flex-direction:row;padding:14px 20px;justify-content:space-between;align-items:center;border-bottom:1px solid #f0f0f0;"><span style="font-size:14px;font-weight:500;">扬声器</span><input type="checkbox" checked style="width:44px;height:22px;border-radius:11px;"/></div><div style="display:flex;flex-direction:row;padding:14px 20px;justify-content:space-between;align-items:center;border-bottom:1px solid #f0f0f0;"><span style="width:80px;font-size:14px;font-weight:500;">音量</span><div style="display:flex;flex-direction:row;gap:8px;align-items:center;flex:1;"><span style="width:16px;height:16px;" title="音量图标">🔊</span><input type="range" value="70" style="flex:1;accent-color:#1677ff;"/></div></div><div style="display:flex;flex-direction:row;padding:14px 20px;justify-content:space-between;align-items:center;border-bottom:1px solid #f0f0f0;"><span style="width:80px;font-size:14px;font-weight:500;">提示音量</span><div style="display:flex;flex-direction:row;gap:8px;align-items:center;flex:1;"><span style="width:16px;height:16px;" title="提示音图标">🔔</span><input type="range" value="50" style="flex:1;accent-color:#1677ff;"/></div></div><div style="display:flex;flex-direction:row;padding:14px 20px;justify-content:space-between;align-items:center;border-bottom:1px solid #f0f0f0;"><span style="font-size:14px;font-weight:500;">按键音</span><input type="checkbox" checked style="width:44px;height:22px;border-radius:11px;"/></div><div style="display:flex;flex-direction:row;padding:14px 20px;justify-content:space-between;align-items:center;"><span style="font-size:14px;font-weight:500;">麦克风</span><input type="checkbox"  style="width:44px;height:22px;border-radius:11px;"/></div></div><div style="flex:1;"></div><div style="background:#ffffff;padding:8px 0;border-radius:12px;box-shadow:0 1px 2px rgba(0,0,0,0.05);"><div style="display:flex;flex-direction:row;padding:14px 20px;justify-content:space-between;align-items:center;"><span style="width:80px;font-size:14px;font-weight:500;">亮度</span><div style="display:flex;flex-direction:row;gap:8px;align-items:center;flex:1;"><span style="width:16px;height:16px;" title="亮度图标">☀</span><input type="range" value="60" style="flex:1;accent-color:#1677ff;"/></div></div></div></div></div></div>
</body>
</html>
