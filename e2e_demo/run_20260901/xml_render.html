<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">

<title>Android XML Render</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Roboto','Segoe UI',sans-serif; background:#f5f5f5; width:960px; height:720px; overflow:hidden; }
.android-switch { transform:scale(1.2); }
button { font-family:inherit; }
input[type="range"] { height:4px; -webkit-appearance:none; background:#e0e0e0; border-radius:2px; }
input[type="range"]::-webkit-slider-thumb { -webkit-appearance:none; width:18px; height:18px; border-radius:50%; background:#1677ff; }
</style>
</head>
<body>
<div style="display:flex;flex-direction:column;width:100%;height:100%;background:#f5f5f5;"><div style="display:flex;flex-direction:row;width:100%;height:auto;padding:16dp;justify-content:flex-end;"></div><div style="display:flex;flex-direction:row;width:100%;height:0px;padding-left:16dp;padding-right:16dp;padding-bottom:16dp;flex:1;"><div style="display:flex;flex-direction:column;width:240px;height:100%;background:#ffffff;padding:16dp;"><span style="font-size:24px;color:#212121;font-weight:bold;margin-bottom:16dp;">设置</span><div style="display:flex;flex-direction:column;width:100%;height:auto;"><div style="display:flex;flex-direction:row;width:100%;height:auto;padding:12dp;align-items:center;"><span style="font-size:16px;color:#212121;">企业服务配置</span></div><div style="display:flex;flex-direction:row;width:100%;height:auto;background:#E6F0FF;padding:12dp;align-items:center;"><span style="font-size:16px;color:#1677ff;font-weight:bold;">声音与显示</span></div><div style="display:flex;flex-direction:row;width:100%;height:auto;padding:12dp;align-items:center;"><span style="font-size:16px;color:#212121;">摄像机</span></div><div style="display:flex;flex-direction:row;width:100%;height:auto;padding:12dp;align-items:center;"><span style="font-size:16px;color:#212121;">壁纸</span><span style="font-size:12px;color:#999999;">已设置</span></div><div style="display:flex;flex-direction:row;width:100%;height:auto;padding:12dp;align-items:center;"><span style="font-size:16px;color:#212121;">Wi-Fi</span><span style="font-size:12px;color:#999999;">已连接</span></div><div style="display:flex;flex-direction:row;width:100%;height:auto;padding:12dp;align-items:center;"><span style="font-size:16px;color:#212121;">智慧功能</span></div><div style="display:flex;flex-direction:row;width:100%;height:auto;padding:12dp;align-items:center;"><span style="font-size:16px;color:#212121;">高级设置</span></div></div></div><div style="overflow-y:auto;flex:1;width:100%;height:100%;"><div style="display:flex;flex-direction:column;width:100%;height:auto;padding-bottom:16dp;"><span style="font-size:28px;color:#212121;font-weight:bold;margin-bottom:20dp;">声音与显示</span><div style="display:flex;flex-direction:column;width:100%;height:auto;background:#ffffff;padding:16dp;"><div style="display:flex;flex-direction:row;width:100%;height:auto;padding-top:8dp;padding-bottom:8dp;align-items:center;"><span style="font-size:16px;color:#212121;">扬声器</span></div><div style="display:flex;flex-direction:row;width:100%;height:auto;padding-top:8dp;padding-bottom:8dp;align-items:center;"><span style="font-size:24px;width:24px;height:24px;margin-right:12dp;display:flex;align-items:center;justify-content:center;">🔊</span><input type="range" value="70" style="flex:1;accent-color:#1677ff;"/></div><div style="display:flex;flex-direction:row;width:100%;height:auto;padding-top:8dp;padding-bottom:8dp;align-items:center;"><span style="font-size:24px;width:24px;height:24px;margin-right:12dp;display:flex;align-items:center;justify-content:center;">🔊</span><input type="range" value="50" style="flex:1;accent-color:#1677ff;"/></div><div style="display:flex;flex-direction:row;width:100%;height:auto;padding-top:8dp;padding-bottom:8dp;align-items:center;"><span style="font-size:16px;color:#212121;">按键音</span></div><div style="display:flex;flex-direction:row;width:100%;height:auto;padding-top:8dp;padding-bottom:8dp;align-items:center;"><span style="font-size:16px;color:#212121;">麦克风</span></div></div><div style="display:flex;flex-direction:row;width:100%;height:auto;background:#ffffff;padding:16dp;align-items:center;"><span style="font-size:24px;width:24px;height:24px;margin-right:12dp;display:flex;align-items:center;justify-content:center;">☀</span><input type="range" value="80" style="flex:1;accent-color:#1677ff;"/></div></div></div></div></div>

</html>
